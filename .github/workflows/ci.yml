name: ci

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Node.js and npm versions from devEngines
        id: devengines
        shell: bash
        run: |
          echo "NODE_VERSION=$(jq -r '.devEngines.runtime.version' package.json)" >> "$GITHUB_ENV"
          echo "NPM_VERSION=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_ENV"
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Update npm to the pinned version
        run: npm install -g npm@${{ env.NPM_VERSION }}
      - name: Install third party dependencies
        run: npm ci
      - name: Check for third party vulnerabilities
        run: npm audit --omit=dev
      - name: Check for linting warnings and errors
        run: npm run lint
